name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build --config Release
      - run: ctest --test-dir build -C Release --output-on-failure
  sanitizers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: cmake -S . -B build -DCMAKE_C_COMPILER=clang -DLOGSCAN_SANITIZE=ON -DCMAKE_BUILD_TYPE=Debug
      - run: cmake --build build
      - run: ctest --test-dir build --output-on-failure
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1
      - name: Bounded parser fuzzing
        run: |
          clang -std=c17 -g -O1 -Iinclude -fsanitize=fuzzer,address,undefined tests/fuzz_parser.c src/parser.c -o parser_fuzz
          mkdir corpus
          head -n 1 examples/access.txt | tr -d '\n' > corpus/common
          ./parser_fuzz corpus -runs=20000 -max_len=8192 -timeout=5
